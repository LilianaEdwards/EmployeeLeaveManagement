
name: LeaveFlow CI

on:
  push:
    branches:
      - master
      - 'feature/**'

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test LeaveFlow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore EmployeeLeaveManagement.slnx

      - name: Build .NET solution
        run: dotnet build EmployeeLeaveManagement.slnx --configuration Release --no-restore

      - name: Run backend unit tests
        run: dotnet test EmployeeLeaveManagement.slnx --configuration Release --no-build --no-restore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build EmployeeService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/EmployeeService/Dockerfile
          push: false
          tags: leaveflow-employee-service:ci
          build-args: |
            DatabaseProvider=PostgreSQL

      - name: Build LeaveService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/LeaveService/Dockerfile
          push: false
          tags: leaveflow-leave-service:ci
          build-args: |
            DatabaseProvider=PostgreSQL

      - name: Build NotificationService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/NotificationService/Dockerfile
          push: false
          tags: leaveflow-notification-service:ci

  docker-publish:
    name: Publish Docker Images to GHCR
    runs-on: ubuntu-latest

    needs:
      - build-and-test
      - docker-build

    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate EmployeeService image tags
        id: meta-employee
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lilianaedwards/leaveflow-employee-service
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish EmployeeService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/EmployeeService/Dockerfile
          push: true
          tags: ${{ steps.meta-employee.outputs.tags }}
          labels: ${{ steps.meta-employee.outputs.labels }}
          build-args: |
            DatabaseProvider=PostgreSQL

      - name: Generate LeaveService image tags
        id: meta-leave
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lilianaedwards/leaveflow-leave-service
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish LeaveService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/LeaveService/Dockerfile
          push: true
          tags: ${{ steps.meta-leave.outputs.tags }}
          labels: ${{ steps.meta-leave.outputs.labels }}
          build-args: |
            DatabaseProvider=PostgreSQL

      - name: Generate NotificationService image tags
        id: meta-notification
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lilianaedwards/leaveflow-notification-service
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Publish NotificationService image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/NotificationService/Dockerfile
          push: true
          tags: ${{ steps.meta-notification.outputs.tags }}
          labels: ${{ steps.meta-notification.outputs.labels }}
