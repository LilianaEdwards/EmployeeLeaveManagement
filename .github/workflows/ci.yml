name: LeaveFlow CI

on:
  push:
    branches:
      - master
      - 'feature/**'

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test LeaveFlow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore .NET dependencies
        run: dotnet restore EmployeeLeaveManagement.slnx

      - name: Build .NET solution
        run: dotnet build EmployeeLeaveManagement.slnx --configuration Release --no-restore

      - name: Run backend unit tests
        run: dotnet test EmployeeLeaveManagement.slnx --configuration Release --no-build --no-restore

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build React frontend
        working-directory: frontend
        run: npm run build
