services:
  postgres:
    image: postgres:17-alpine
    container_name: leaveflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: employeedb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - leaveflow-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d employeedb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  employeeservice:
    build:
      context: .
      dockerfile: src/EmployeeService/Dockerfile
      args:
        DatabaseProvider: PostgreSQL
    container_name: leaveflow-employee-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      HttpsRedirection__Enabled: "false"
      DatabaseProvider: PostgreSQL
      ConnectionStrings__EmployeeDatabase: "Host=postgres;Port=5432;Database=employeedb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-EmployeeLeaveManagement}
      Jwt__Audience: ${JWT_AUDIENCE:-EmployeeLeaveManagement}
      ServiceAuthentication__ApiKey: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      BootstrapHod__FullName: ${BOOTSTRAP_HOD_FULL_NAME:?Set BOOTSTRAP_HOD_FULL_NAME in .env}
      BootstrapHod__Email: ${BOOTSTRAP_HOD_EMAIL:?Set BOOTSTRAP_HOD_EMAIL in .env}
      BootstrapHod__Department: ${BOOTSTRAP_HOD_DEPARTMENT:?Set BOOTSTRAP_HOD_DEPARTMENT in .env}
      BootstrapHod__Password: ${BOOTSTRAP_HOD_PASSWORD:?Set BOOTSTRAP_HOD_PASSWORD in .env}
    ports:
      - "5076:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  leaveservice:
    build:
      context: .
      dockerfile: src/LeaveService/Dockerfile
      args:
        DatabaseProvider: PostgreSQL
    container_name: leaveflow-leave-service
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      HttpsRedirection__Enabled: "false"
      DatabaseProvider: PostgreSQL
      ConnectionStrings__LeaveDatabase: "Host=postgres;Port=5432;Database=leavedb;Username=postgres;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-EmployeeLeaveManagement}
      Jwt__Audience: ${JWT_AUDIENCE:-EmployeeLeaveManagement}
      ServiceAuthentication__ApiKey: ${SERVICE_API_KEY:?Set SERVICE_API_KEY in .env}
      Services__EmployeeService__BaseUrl: http://employeeservice:8080
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      employeeservice:
        condition: service_started
    restart: unless-stopped

  notificationservice:
    build:
      context: .
      dockerfile: src/NotificationService/Dockerfile
    container_name: leaveflow-notification-service
    environment:
      DOTNET_ENVIRONMENT: Development
    restart: unless-stopped

volumes:
  leaveflow-postgres-data:
